[project]
name = "paradise-park-sales-agent"
version = "0.6.6"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==46.0.3",
    "fastapi>=0.141.1",
    "google-cloud-aiplatform[adk,agent-engines]>=1.112",
    "google-cloud-firestore>=2.21.0,<3",
    "google-genai>=2.19.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "squareup>=45.1.0.20260819",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
paradise-park-sales-agent = "paradise_park_sales_agent:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
